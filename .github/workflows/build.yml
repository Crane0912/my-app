name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压并诊断
        run: |
          Z=$(find . -maxdepth 1 -name '*.zip' | head -1)
          echo "### zip: $Z"
          unzip -q "$Z" -d src
          echo "### 顶层"
          ls src
          echo "### 关键文件"
          find src -maxdepth 3 \( -name gradlew -o -name 'settings.gradle*' -o -name 'build.gradle*' \)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 编译
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          GW=$(find src -name gradlew -type f | head -1)
          if [ -z "$GW" ]; then echo "::error::未找到 gradlew"; exit 1; fi
          sed -i 's/\r$//' "$GW"
          chmod 755 "$GW"
          cd "$(dirname "$GW")"
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: src/**/build/outputs/apk/debug/*.apk
